name: Build DR Automatica (Astro)

on:
  push:
    branches: [main]
    paths:
      - 'astro-drautomatica/**'
      - 'astro-drautomatica/package-lock.json'
      - 'inicio.html'
      - 'modelado.html'
      - 'simulacion.html'
      - 'control.html'
      - 'optimizacion.html'
      - 'miscelanea.html'
      - 'Python.html'
      - 'MATLAB.html'
      - 'LaTeX.html'
      - 'iLaTeX.html'
      - 'html/**'
      - 'pdf/**'
      - 'images/**'
      - 'arm.png'
      - 'banner.png'
      - 'banner_1200x630.png'
      - 'drAutomatica.png'
      - 'LaTeX_logo.png'
      - 'matlab-online.svg'
      - 'monline.png'
      - 'MonaspaceNeon-Regular.woff2'
      - 'python_logo.png'
      - '.github/workflows/build-drautomatica.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drautomatica-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: astro-drautomatica
        run: npm ci

      - name: Build Astro site
        working-directory: astro-drautomatica
        run: npm run build

      - name: Commit generated /drautomatica site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A drautomatica
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Build DR Automatica Astro site"
          git push
