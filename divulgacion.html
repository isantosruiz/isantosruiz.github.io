  <meta charset="utf-8">

  <title>Redirección a drautomatica</title>
  <meta name="description" content="Acceso automático al sitio de drautomatica.">
  <style>
    :root { color-scheme: dark; --teal: #2dd4bf; --soft: #99f6e4; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100svh; margin: 0; place-items: center; padding: 2rem; overflow: hidden; color: #f8fafc; text-align: center; background: radial-gradient(circle at 50% 18%, rgb(45 212 191 / 12%), transparent 34rem), linear-gradient(145deg, #061018, #0a1e29 54%, #07131b); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { width: min(100%, 32rem); padding: clamp(2rem, 7vw, 3.5rem); border: 1px solid rgb(255 255 255 / 10%); border-radius: 2rem; background: linear-gradient(155deg, rgb(255 255 255 / 8%), rgb(255 255 255 / 3%)); box-shadow: 0 2rem 6rem rgb(0 0 0 / 34%); backdrop-filter: blur(18px); animation: enter .6s ease both; }
    .mark { position: relative; display: grid; width: 7.25rem; height: 7.25rem; margin: 0 auto 2rem; place-items: center; }
    .photo { display: block; width: 5rem; height: 5rem; border: 2px solid rgb(153 246 228 / 62%); border-radius: 50%; object-fit: cover; object-position: 50% 27%; box-shadow: 0 0 0 .35rem rgb(45 212 191 / 8%), 0 0 1.5rem rgb(45 212 191 / 20%); }
    .orbit { position: absolute; inset: 0; border: 1px solid rgb(153 246 228 / 26%); border-right-color: var(--teal); border-radius: 50%; animation: spin 2s linear infinite; }
    .orbit.inner { inset: .6rem; border-color: transparent var(--soft) transparent rgb(153 246 228 / 18%); animation-direction: reverse; animation-duration: 1.25s; }
    .eyebrow { margin: 0 0 .8rem; color: var(--soft); font-size: .72rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); font-weight: 650; letter-spacing: -.045em; line-height: 1.05; }
    .message { margin: 1rem auto 1.8rem; color: #a9bbc5; font-size: .98rem; line-height: 1.7; }
    .track { height: .22rem; overflow: hidden; border-radius: 999px; background: rgb(255 255 255 / 9%); }
    .bar { display: block; width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #14b8a6, var(--soft)); box-shadow: 0 0 1rem rgb(45 212 191 / 70%); transform: scaleX(0); transform-origin: left; animation: progress 2s linear forwards; }
    a { display: inline-block; margin-top: 1.5rem; color: #c9d9df; font-size: .86rem; text-decoration: none; }
    a:hover, a:focus-visible { color: var(--soft); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes progress { to { transform: scaleX(1); } }
    @keyframes enter { from { opacity: 0; transform: translateY(.75rem) scale(.98); } }
    @media (prefers-reduced-motion: reduce) { .card, .orbit { animation: none; } }
  </style>
